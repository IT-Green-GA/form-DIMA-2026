<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitácora de parcela de Axel</title>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">🌱</div>
    <div>
      <h1>Bitácora de parcela de Axel</h1>
      <p class="subtitulo">Registro de actividades por parcela, cultivo y fecha.</p>
      <p class="autor">Autor: Axel Manjarrez</p>
    </div>
  </header>

  <main>
    <form id="registro" class="tarjeta">
      <h2>
        <span class="ico" aria-hidden="true">📝</span>
        Nuevo registro
      </h2>

      <div class="dos">
        <div class="campo">
          <label>
            <span class="ico" aria-hidden="true">📅</span>
            Fecha<span class="req">*</span>
          </label>
          <div class="fecha-tipo" role="radiogroup" aria-label="Origen de la fecha">
            <label class="opcion-fecha activo">
              <input type="radio" name="fecha-tipo" value="hoy" checked>
              <span class="opc-ico" aria-hidden="true">📅</span>
              <span class="opc-texto">Hoy</span>
            </label>
            <label class="opcion-fecha">
              <input type="radio" name="fecha-tipo" value="otra">
              <span class="opc-ico" aria-hidden="true">🗓️</span>
              <span class="opc-texto">Otra fecha</span>
            </label>
          </div>
          <div class="input-icon fecha-input">
            <span class="ico-lado" aria-hidden="true">🗓️</span>
            <input id="fecha" type="date" name="fecha" required>
          </div>
        </div>
        <div class="campo input-icon">
          <label for="cultivo">
            <span class="ico" aria-hidden="true">🌽</span>
            Cultivo
          </label>
          <span class="ico-lado" aria-hidden="true">🌽</span>
          <select id="cultivo" name="cultivo">
            <option value="🌽 Maíz">🌽 Maíz</option>
            <option value="🫘 Frijol">🫘 Frijol</option>
            <option value="🌱 Haba">🌱 Haba</option>
            <option value="🌾 Avena">🌾 Avena</option>
          </select>
        </div>
      </div>

      <div class="campo input-icon">
        <label for="parcela">
          <span class="ico" aria-hidden="true">🗺️</span>
          Parcela
        </label>
        <span class="ico-lado" aria-hidden="true">🗺️</span>
        <select id="parcela" name="parcela">
          <option>P-077 El Cerrito</option>
          <option>P-012 La Loma</option>
          <option>P-031 San Diego</option>
        </select>
      </div>

      <div class="campo input-icon">
        <label for="actividad">
          <span class="ico" aria-hidden="true">⚙️</span>
          Actividad
        </label>
        <span class="ico-lado" aria-hidden="true">⚙️</span>
        <select id="actividad" name="actividad">
          <option value="👁️ Observación">👁️ Observación</option>
          <option value="💧 Riego">💧 Riego</option>
          <option value="🧪 Fertilización">🧪 Fertilización</option>
          <option value="🔬 Muestreo">🔬 Muestreo</option>
        </select>
      </div>

      <div class="campo input-icon">
        <label for="observaciones">
          <span class="ico" aria-hidden="true">💬</span>
          Observaciones
        </label>
        <span class="ico-lado" aria-hidden="true">💬</span>
        <textarea id="observaciones" name="observaciones" rows="3" placeholder="Notas de la actividad..."></textarea>
      </div>

      <button type="submit">
        <span class="ico" aria-hidden="true">💾</span>
        Guardar registro
      </button>
      <p id="estado" class="estado" role="status"></p>
    </form>

    <section class="tarjeta tabla">
      <h2 class="registros">
        <span class="ico" aria-hidden="true">📋</span>
        Registros guardados
      </h2>
      <table id="registros">
        <thead>
          <tr><th>Fecha</th><th>Parcela</th><th>Cultivo</th><th>Actividad</th><th>Observaciones</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
